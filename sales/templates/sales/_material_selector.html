<div class="mb-3">
    <label class="form-label">Material Type</label>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="material_mode" value="single" checked>
        <label class="form-check-label">Single Material</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="material_mode" value="laminate">
        <label class="form-check-label">Laminated Film (multiple materials)</label>
    </div>
</div>

<div class="material-single-field">
    <div class="mb-3">
        <label class="form-label">Material</label>
        <select class="form-select" name="material_id">
            <option value="">Select Material</option>
            {% for material in materials %}
            <option value="{{ material.id }}" data-density="{{ material.density }}">{{ material.name }} ({{ material.density }} g/cm&sup3;)</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="material-laminate-field" style="display:none;">
    <label class="form-label">Laminate Layer Materials</label>
    <div class="laminate-material-rows">
        <div class="row mb-2 laminate-material-row">
            <div class="col-12">
                <select class="form-select" name="layer_material_id[]">
                    <option value="">Select Material</option>
                    {% for material in materials %}
                    <option value="{{ material.id }}">{{ material.name }} ({{ material.density }} g/cm&sup3;)</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row mb-2 laminate-material-row">
            <div class="col-12">
                <select class="form-select" name="layer_material_id[]">
                    <option value="">Select Material</option>
                    {% for material in materials %}
                    <option value="{{ material.id }}">{{ material.name }} ({{ material.density }} g/cm&sup3;)</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>
    <div class="mb-3">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addLaminateMaterialRow(this)"><i class="fas fa-plus"></i> Add Material</button>
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLaminateMaterialRow(this)"><i class="fas fa-minus"></i> Remove Material</button>
    </div>
</div>
