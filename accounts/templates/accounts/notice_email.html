<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f1ea; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f1ea; padding: 30px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e0d8;">
                    <tr>
                        <td style="background-color:#10141a; padding: 22px 32px;">
                            <span style="color:#ff7a45; font-size:20px; font-weight:bold;">PlastIQ</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 32px;">
                            {% if badge_text %}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 18px;">
                                <tr>
                                    <td align="center">
                                        <span style="display:inline-block; background-color:{{ badge_color }}; color:#10141a; font-weight:bold; font-size:12px; padding:5px 12px; border-radius:20px;">
                                            {{ badge_text }}
                                        </span>
                                    </td>
                                </tr>
                            </table>
                            {% endif %}
                            <p style="margin:0 0 14px; font-size:17px; font-weight:bold; color:#10141a;">{{ heading }}</p>
                            <p style="margin:0; font-size:15px; color:#495057; line-height:1.6; white-space: pre-line;">{{ message }}</p>
                            {% if action_url %}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top: 22px;">
                                <tr>
                                    <td align="center">
                                        <a href="{{ action_url }}" style="display:inline-block; background-color:#ff7a45; color:#10141a; font-weight:bold; font-size:14px; padding:11px 24px; border-radius:8px; text-decoration:none;">
                                            {{ action_label|default:"Open PlastIQ" }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            {% endif %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 18px 32px; background-color:#f8f7f3; border-top:1px solid #e2e0d8;">
                            <p style="margin:0; font-size:12px; color:#8b97a6;">PlastIQ &middot; Plastic manufacturing QC &amp; pricing tools</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
