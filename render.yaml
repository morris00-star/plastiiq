# render.yaml
services:
  - type: web
    name: plastic-qc-calculator
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn qc_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plastic_qc_db
          property: connectionString

databases:
  - name: plastic_qc_db
    plan: free
    databaseName: plastic_qc
    user: plastic_qc_user
