<style>
#liveClockWidget {
    position: fixed;
    top: 80px;
    left: 30px;
    z-index: 1900;
    background: var(--bg-panel, #fff);
    color: var(--text-main, #171b21);
    border: 1px solid var(--line, #ddd);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 8px 14px;
    font-size: .85rem;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
}
#liveClockWidget .lcw-time { font-weight: 700; font-family: 'Courier New', monospace; }
#lcwCalendarPopover {
    position: fixed;
    top: 130px;
    left: 30px;
    z-index: 1901;
    background: var(--bg-panel, #fff);
    border: 1px solid var(--line, #ddd);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    padding: 12px;
    width: 260px;
    display: none;
}
#lcwCalendarPopover .lcw-cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; font-weight: 600;
}
#lcwCalendarPopover .lcw-cal-header button {
    background: transparent; border: none; color: inherit; font-size: 1rem; padding: 2px 8px;
}
#lcwCalendarPopover table { width: 100%; border-collapse: collapse; font-size: .8rem; }
#lcwCalendarPopover th { color: var(--text-dim, #888); font-weight: 500; padding: 4px 0; }
#lcwCalendarPopover td { text-align: center; padding: 5px 0; border-radius: 4px; }
#lcwCalendarPopover td.lcw-today { background: var(--molten, #ff6b35); color: #fff; font-weight: 700; }
#lcwCalendarPopover td.lcw-empty { color: transparent; }

@media (max-width: 768px) {
    #liveClockWidget { left: 10px; top: 10px; font-size: .75rem; padding: 6px 10px; }
    #lcwCalendarPopover { left: 10px; top: 55px; width: calc(100vw - 20px); max-width: 300px; }
}
</style>

<div id="liveClockWidget" title="Click for calendar">
    <i class="far fa-clock"></i>
    <span class="lcw-time" id="lcwTime">--:--:--</span>
    <span id="lcwDate">--</span>
</div>

<div id="lcwCalendarPopover">
    <div class="lcw-cal-header">
        <button type="button" id="lcwPrevMonth"><i class="fas fa-chevron-left"></i></button>
        <span id="lcwMonthLabel"></span>
        <button type="button" id="lcwNextMonth"><i class="fas fa-chevron-right"></i></button>
    </div>
    <table>
        <thead><tr><th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr></thead>
        <tbody id="lcwCalendarBody"></tbody>
    </table>
</div>

<script>
(function() {
    const timeEl = document.getElementById('lcwTime');
    const dateEl = document.getElementById('lcwDate');
    const widget = document.getElementById('liveClockWidget');
    const popover = document.getElementById('lcwCalendarPopover');
    const monthLabel = document.getElementById('lcwMonthLabel');
    const calBody = document.getElementById('lcwCalendarBody');

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
        const now = new Date();
        timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    let calYear, calMonth;
    const today = new Date();

    function renderCalendar() {
        monthLabel.textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

        let html = '<tr>';
        for (let i = 0; i < firstDay; i++) html += '<td class="lcw-empty">-</td>';

        let cellCount = firstDay;
        for (let day = 1; day <= daysInMonth; day++) {
            const isToday = calYear === today.getFullYear() && calMonth === today.getMonth() && day === today.getDate();
            html += `<td class="${isToday ? 'lcw-today' : ''}">${day}</td>`;
            cellCount++;
            if (cellCount % 7 === 0 && day !== daysInMonth) html += '</tr><tr>';
        }
        html += '</tr>';
        calBody.innerHTML = html;
    }

    function resetToToday() {
        calYear = today.getFullYear();
        calMonth = today.getMonth();
        renderCalendar();
    }
    resetToToday();

    document.getElementById('lcwPrevMonth').addEventListener('click', function() {
        calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    });
    document.getElementById('lcwNextMonth').addEventListener('click', function() {
        calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
    });

    widget.addEventListener('click', function() {
        popover.style.display = popover.style.display === 'block' ? 'none' : 'block';
        if (popover.style.display === 'block') resetToToday();
    });
    document.addEventListener('click', function(e) {
        if (!widget.contains(e.target) && !popover.contains(e.target)) popover.style.display = 'none';
    });
})();
</script>
