<style>
/* Lives inside .navbar-nav as a real nav-item, so it inherits the same
   spacing/hover rules as every other nav link instead of floating over
   the page. The popover reuses the app's existing .dropdown-menu styling
   (same border, shadow, radius, mobile static-position behavior). */
#lcwNavItem { position: relative; }

#lcwNavItem .nav-link {
    flex-direction: column;
    align-items: flex-start !important;
    line-height: 1.15;
    gap: 0 !important;
    padding-top: .45rem;
    padding-bottom: .45rem;
}

#lcwNavItem .lcw-top {
    display: flex;
    align-items: center;
    gap: .5rem;
}

.lcw-time {
    font-weight: 700;
    font-family: var(--font-mono);
    font-size: .85rem;
}

.lcw-date {
    font-family: var(--font-mono);
    font-size: .62rem;
    color: var(--text-dim);
    letter-spacing: .03em;
    margin-left: 26px;
}

#lcwCalendarPopover {
    min-width: 260px;
    padding: 12px;
}

#lcwCalendarPopover .lcw-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 600;
    color: var(--text-main);
}

#lcwCalendarPopover .lcw-cal-header button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1rem;
    padding: 2px 8px;
    border-radius: 6px;
}
#lcwCalendarPopover .lcw-cal-header button:hover { color: var(--molten); }

#lcwCalendarPopover table { width: 100%; border-collapse: collapse; font-size: .8rem; }
#lcwCalendarPopover th { color: var(--text-dim); font-weight: 500; padding: 4px 0; }
#lcwCalendarPopover td { text-align: center; padding: 5px 0; border-radius: 4px; color: var(--text-main); }
#lcwCalendarPopover td.lcw-today { background: var(--molten); color: #fff; font-weight: 700; }
#lcwCalendarPopover td.lcw-empty { color: transparent; }

@media (max-width: 768px) {
    #lcwNavItem .nav-link { flex-direction: row; align-items: center !important; }
    .lcw-date { display: none; }
}
</style>

<li class="nav-item dropdown" id="lcwNavItem">
    <a class="nav-link" href="#" id="liveClockWidget" role="button" title="Click for calendar">
        <span class="lcw-top"><i class="far fa-clock"></i><span class="lcw-time" id="lcwTime">--:--:--</span></span>
        <span class="lcw-date" id="lcwDate">--</span>
    </a>
    <div id="lcwCalendarPopover" class="dropdown-menu dropdown-menu-end">
        <div class="lcw-cal-header">
            <button type="button" id="lcwPrevMonth"><i class="fas fa-chevron-left"></i></button>
            <span id="lcwMonthLabel"></span>
            <button type="button" id="lcwNextMonth"><i class="fas fa-chevron-right"></i></button>
        </div>
        <table>
            <thead><tr><th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr></thead>
            <tbody id="lcwCalendarBody"></tbody>
        </table>
    </div>
</li>

<script>
(function() {
    const timeEl = document.getElementById('lcwTime');
    const dateEl = document.getElementById('lcwDate');
    const link = document.getElementById('liveClockWidget');
    const popover = document.getElementById('lcwCalendarPopover');
    const monthLabel = document.getElementById('lcwMonthLabel');
    const calBody = document.getElementById('lcwCalendarBody');

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
        const now = new Date();
        timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    let calYear, calMonth;
    const today = new Date();

    function renderCalendar() {
        monthLabel.textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

        let html = '<tr>';
        for (let i = 0; i < firstDay; i++) html += '<td class="lcw-empty">-</td>';

        let cellCount = firstDay;
        for (let day = 1; day <= daysInMonth; day++) {
            const isToday = calYear === today.getFullYear() && calMonth === today.getMonth() && day === today.getDate();
            html += `<td class="${isToday ? 'lcw-today' : ''}">${day}</td>`;
            cellCount++;
            if (cellCount % 7 === 0 && day !== daysInMonth) html += '</tr><tr>';
        }
        html += '</tr>';
        calBody.innerHTML = html;
    }

    function resetToToday() {
        calYear = today.getFullYear();
        calMonth = today.getMonth();
        renderCalendar();
    }
    resetToToday();

    document.getElementById('lcwPrevMonth').addEventListener('click', function(e) {
        e.stopPropagation();
        calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    });
    document.getElementById('lcwNextMonth').addEventListener('click', function(e) {
        e.stopPropagation();
        calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
    });

    // Same open/close pattern as the app's other navbar dropdowns
    // (toggle the Bootstrap ".show" class), so behavior and mobile
    // layout stay consistent across every dropdown in the navbar.
    link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const isOpen = popover.classList.contains('show');
        document.querySelectorAll('.navbar .dropdown-menu.show').forEach(function(m) { m.classList.remove('show'); });
        if (!isOpen) { popover.classList.add('show'); resetToToday(); }
    });
    document.addEventListener('click', function(e) {
        if (!popover.contains(e.target) && e.target !== link && !link.contains(e.target)) {
            popover.classList.remove('show');
        }
    });
    popover.addEventListener('click', function(e) { e.stopPropagation(); });
})();
</script>
